name: CI

on:
  push:
    branches:
      - main
      - feat/mealkhata-v3-dynamic-students
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-and-security:
    name: Lint, Test, Build & Security Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Code Quality & Linting
        run: npm run lint

      - name: Run Test Suites
        run: npm test

      - name: Build Production Frontend
        run: npm run build

      - name: Verify Production Server & Dual-Mode Build
        run: npm run verify-production-build

      - name: Check representative endpoint performance
        run: npm run perf:check

      - name: Automated Security & Dependency Check
        run: npm run security:check

      - name: Audit all dependencies for high severity advisories
        run: npm audit --audit-level=high

  isolated-browser:
    name: Isolated replica set and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser acceptance
        run: npm run e2e:browser
