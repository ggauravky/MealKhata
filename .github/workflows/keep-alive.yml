name: Keep backend awake

# Render's free web services sleep after ~15 minutes without traffic. This pings the
# lightweight liveness route so the API is already awake when someone opens the site.
# GitHub may delay scheduled runs; an external monitor (see docs/SETUP.md) is more precise.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health (allowing for a cold start)
        env:
          HEALTH_URL: https://meal-khata-api.onrender.com/api/health
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$HEALTH_URL" || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Backend did not answer 200 on /api/health"
          exit 1
