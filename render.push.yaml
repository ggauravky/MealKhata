services:
  - type: web
    name: meal-khata-api
    runtime: node
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: MONGODB_URI
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  - type: cron
    name: meal-khata-reminder-runner
    runtime: node
    branch: main
    schedule: "*/5 * * * *"
    buildCommand: npm ci --omit=dev
    startCommand: npm run send-push-reminders
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: MONGODB_URI
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
