services:
  - type: web
    name: meal-khata-api
    runtime: node
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci --omit=dev
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/ready
    maxShutdownDelaySeconds: 20
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      # Existing services must set sync:false values manually in the dashboard.
      - key: MEALKHATA_RUNTIME_PROFILE
        sync: false
      - key: CANONICAL_ONLY_AUTH
        sync: false
      - key: V3_RELEASE_BUILD_SHA
        sync: false
      - key: V3_RELEASE_ATTESTATION_PATH
        sync: false
      - key: V3_RELEASE_OWNER_PUBLIC_KEY
        sync: false
      - key: V3_RELEASE_OPERATOR_PUBLIC_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      - key: APP_ORIGIN
        sync: false
      # OPTIONAL WEB PUSH
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
