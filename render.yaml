services:
  - type: web
    name: meal-khata-api
    runtime: node
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci --omit=dev
    startCommand: npm run start --workspace backend
    # Liveness: the service must be able to start before the one-time Super Admin setup.
    # /api/ready reports full readiness (setup, Super Admin, indexes) for monitoring.
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 20
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      # Existing services must set sync:false values manually in the dashboard.
      - key: MONGODB_URI
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      - key: APP_ORIGIN
        sync: false
      # OPTIONAL WEB PUSH
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
